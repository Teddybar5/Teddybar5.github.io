<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animalia – Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0b0c0f;
      --panel: #12141a;
      --text: #e6e8ef;
      --muted: #b6b9c6;
      --accent: #6ee7ff;
      --border: #222534;
      --link: #8bdcff;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
      --max: 900px;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      line-height:1.6;
    }

    a{ color: var(--link); text-decoration:none; }
    a:hover{ text-decoration: underline; }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:24px;
      color: var(--muted);
      font-weight:600;
    }

    h1{
      font-size: clamp(28px, 5vw, 40px);
      margin: 0 0 12px 0;
      font-weight:800;
    }

    h2{
      font-size: 22px;
      margin: 0 0 10px 0;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    p{ margin: 0 0 12px 0; }

    .meta{
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    section{ margin-bottom: 28px; }

    .video-container{
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .video-container iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:10px;
      background:#0f1320;
      border:1px solid var(--border);
      font-weight:600;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <a href="index.html" class="back">← Back to Portfolio</a>

    <!-- Overview -->
    <section class="card">
      <h1>Overview</h1>
      <div class="meta">June 2026 - Present · Unreal 3D</div>
      <p>
        <strong>Animalia</strong> is 3D isometric rpg narrative experience in active development.
      </p>
      <p>
        I am the sole puzzle designer for the project
      </p>
    </section>

    <!-- Solo Development -->
    <section class="card">
      <h2>Puzzle Design</h2>
      <p>
         UNDER CONSTRUCTION
      </p>
      <p>
        
      </p>
    </section>

    <!-- Gameplay Video still? -->
    

  </div>
</body>
</html>
